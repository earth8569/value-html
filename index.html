<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Value HTML</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="features.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%239d87ff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#16181d;--panel:#1c1f26;--panel2:#22262e;--fg:#e6e6e6;--muted:#9aa4b2;--border:#323843;--code:#20242c;
  --accent:#9d87ff;--link:#a99bff;--node:#8b94a3;--tagnode:#4ade80;--danger:#f87171;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#ffffff;--panel:#f6f7f9;--panel2:#eceef2;--fg:#1f2328;--muted:#59636e;--border:#d1d9e0;--code:#f1f2f5;
  --accent:#7c5cff;--link:#6d4aff;--node:#7a8494;--tagnode:#16a34a;--danger:#dc2626;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
input[type=text],input:not([type]),input[type=search]{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:4px 8px;min-width:0}
input:focus{outline:1px solid var(--accent);border-color:var(--accent)}
[hidden]{display:none!important}

#app{display:flex;flex-direction:column;height:100%}
#topbar{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--border);height:44px;flex:none}
.brand{font-weight:700;letter-spacing:.2px}
.brand b{color:var(--accent)}
#vaultName{color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:6px 0 0 6px;margin-left:0}
.seg button:last-child{border-radius:0 6px 6px 0}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.spacer{flex:1}
#status{color:var(--muted);font-size:12px;min-width:70px;text-align:right}

#main{display:flex;flex:1;min-height:0}
#side{width:250px;flex:none;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
#side .head{padding:8px;display:flex;gap:6px}
#side .head input{flex:1}
#files{flex:1;overflow:auto;padding:0 4px 12px}
.folder{display:flex;align-items:center;gap:4px;padding:3px 6px;color:var(--muted);cursor:pointer;user-select:none;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.item{display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:6px;cursor:pointer}
.item:hover{background:var(--panel2)}
.item.active{background:color-mix(in srgb,var(--accent) 25%,transparent)}
.item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .x{display:none;padding:0 6px;border:none;background:none;color:var(--muted)}
.item:hover .x{display:block}
.item .x:hover{color:var(--danger)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--node)}
.indent{padding-left:14px}

#center{flex:1;display:flex;min-width:0;min-height:0}
#notePane{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#graphPane{flex:1;position:relative;min-width:0;min-height:0;border-left:1px solid var(--border);background:var(--bg)}
body[data-view="note"] #graphPane{display:none}
body[data-view="graph"] #notePane{display:none}
body[data-view="graph"] #right{display:none}
#toolbar{display:flex;flex-wrap:wrap;gap:4px;padding:6px 12px;border-bottom:1px solid var(--border);background:var(--panel)}
#toolbar button{padding:2px 8px;min-width:30px}
#toolbar .sep{width:1px;background:var(--border);margin:0 4px}
#toolbar input[type=color]{width:30px;height:26px;padding:0;border:1px solid var(--border);border-radius:6px;background:none}
#noteScroll{flex:1;overflow:auto;padding:24px 32px 120px}
#noteWrap{max-width:46rem;margin:0 auto}
#title{width:100%;font-size:2em;font-weight:700;background:none;border:none;padding:0 0 .3em;outline:none;border-bottom:1px solid transparent}
#title:focus{border-bottom-color:var(--border)}
#editor{outline:none;min-height:50vh;font-size:16px;line-height:1.65}
#editor:empty::before{content:"Start writing… type [[ to link to another note";color:var(--muted)}

#right{width:270px;flex:none;background:var(--panel);border-left:1px solid var(--border);overflow:auto;padding:12px;min-height:0}
#right h4{margin:16px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
#right h4:first-child{margin-top:0}
#right .row{display:flex;gap:6px;align-items:center;margin:4px 0}
#right input{width:100%}
#right .lnk{display:block;padding:3px 6px;border-radius:5px;cursor:pointer;color:var(--link);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#right .lnk:hover{background:var(--panel2)}
#right .lnk.ghost{opacity:.6;font-style:italic}
#right .meta{color:var(--muted);font-size:12px}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--border);margin:2px 4px 2px 0;font-size:12px;cursor:pointer}
.chip:hover{border-color:var(--accent)}

/* graph */
#gcanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#gcanvas.grabbing{cursor:grabbing}
#gcanvas.pointer{cursor:pointer}
#gtools{position:absolute;top:10px;left:10px;display:flex;gap:6px;z-index:2}
#gtools button{background:color-mix(in srgb,var(--panel) 90%,transparent)}
#gtools button.on{background:var(--accent);border-color:var(--accent);color:#fff}
#glocal{position:absolute;top:48px;left:10px;z-index:2;display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--accent) 22%,var(--panel));border:1px solid var(--accent);border-radius:8px;padding:5px 10px;font-size:12.5px;max-width:calc(100% - 330px)}
#glocal button{padding:1px 8px;font-size:12px;flex:none}
#gpanel{position:absolute;top:48px;right:10px;width:290px;max-height:calc(100% - 60px);overflow:auto;background:color-mix(in srgb,var(--panel) 96%,transparent);border:1px solid var(--border);border-radius:10px;padding:4px 12px 10px;z-index:2;box-shadow:0 8px 30px #0006}
#gpanel details{border-bottom:1px solid var(--border);padding:6px 0}
#gpanel details:last-child{border-bottom:none}
#gpanel summary{cursor:pointer;font-weight:600;padding:4px 0;user-select:none}
.ctl{display:flex;align-items:center;gap:8px;margin:7px 0;justify-content:space-between}
.ctl label{flex:1}
.ctl input[type=range]{width:120px;accent-color:var(--accent)}
.ctl input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.ctl input[type=text]{flex:1}
.grp{display:flex;gap:5px;align-items:center;margin:6px 0}
.grp input[type=color]{width:28px;height:26px;padding:0;border:1px solid var(--border);border-radius:6px;background:none;flex:none}
.grp input[type=text]{flex:1;width:0}
.grp button{padding:2px 6px;flex:none}
.grp .gname{font-size:11px;color:var(--muted)}
.grp.hid{opacity:.45}
#glegend{position:absolute;left:10px;bottom:10px;display:flex;flex-direction:column;gap:3px;background:color-mix(in srgb,var(--panel) 85%,transparent);border:1px solid var(--border);border-radius:8px;padding:6px 10px;z-index:2;max-width:260px;font-size:12px}
#glegend .lg{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
#glegend .lg.hid{opacity:.4;text-decoration:line-through}
#glegend .cnt{color:var(--muted);margin-left:auto;padding-left:10px}
#ginfo{position:absolute;right:12px;bottom:8px;color:var(--muted);font-size:12px}

/* link autocomplete */
#lpop{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--border);border-radius:8px;min-width:220px;max-width:340px;box-shadow:0 8px 30px #0008;overflow:hidden}
#lpop div{padding:5px 10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lpop div.sel,#lpop div:hover{background:color-mix(in srgb,var(--accent) 30%,transparent)}
#lpop .new{color:var(--muted)}

/* modal + toast + welcome */
#modal,#welcome{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:100}
#welcome{background:var(--bg);z-index:90}
.box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px 22px;width:min(420px,92vw)}
.box h3{margin:0 0 8px}
.box p{margin:0 0 12px;color:var(--muted)}
.box input{width:100%;margin-bottom:12px}
.box .row{display:flex;justify-content:flex-end;gap:8px}
#welcome .box{width:min(560px,92vw);padding:28px 32px}
#welcome h1{margin:0 0 4px;font-size:28px}
#welcome .btns{display:flex;flex-direction:column;gap:10px;margin-top:18px}
#welcome .btns button{padding:12px 14px;text-align:left}
#welcome .btns small{display:block;color:var(--muted);font-weight:400}
#welcome .btns button.primary small{color:#fffc}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border);padding:8px 14px;border-radius:8px;z-index:200;box-shadow:0 6px 20px #0006}

@media (max-width:1100px){#right{display:none}}
@media (max-width:760px){#side{display:none}#graphPane{border-left:none}}

/*CONTENT_CSS_APP*/
</style>

  <h1><b style="color:var(--accent)">◈</b> Value HTML</h1>

<script>
'use strict';
/* =====================================================================
   Value HTML, an Obsidian-style graph notebook that stores notes as HTML.
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const lc=s=>String(s).toLowerCase();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};
const PALETTE=['#f59e0b','#a78bfa','#34d399','#f472b6','#60a5fa','#f87171','#2dd4bf','#facc15'];

const DEFAULT_SETTINGS={
  search:'',showTags:false,showUnresolved:true,showOrphans:true,local:false,depth:2,
  nodeSize:4,linkWidth:1,labelThreshold:0.7,arrows:false,
  center:0.05,repel:700,linkForce:0.35,linkDistance:80,
  separate:true,separation:0.22,colorMode:'group'
};

/* ---------------------------------------------------------------- state */
const S={
  backend:null,notes:new Map(),byName:new Map(),backlinks:new Map(),
  active:null,dirty:false,cfg:{settings:{...DEFAULT_SETTINGS},groups:[]},
  collapsed:new Set(),view:'split',gearOpen:false
};

/* --------------------------------------------- shared content styling
   The same rules style the editor (scope "#editor") and every saved
   .html file (scope "article"), so a note looks the same in both. */
const CONTENT_RULES=`
h1,h2,h3,h4{line-height:1.25;margin:1.3em 0 .45em}
h1{font-size:1.9em}h2{font-size:1.5em}h3{font-size:1.25em}h4{font-size:1.1em}
p,ul,ol,blockquote,pre,table{margin:.6em 0}
a{color:var(--link)}
a.wikilink{text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--link) 45%,transparent)}
a.wikilink.unresolved{opacity:.7;border-bottom-style:dashed}
blockquote{border-left:3px solid var(--accent);margin-left:0;padding:.05em 1em;color:var(--muted)}
code{background:var(--code);padding:.1em .35em;border-radius:4px;font-family:ui-monospace,Consolas,monospace;font-size:.9em}
pre{background:var(--code);padding:.8em 1em;border-radius:8px;overflow:auto;font-family:ui-monospace,Consolas,monospace;font-size:.9em}
pre code{background:none;padding:0}
mark{background:#fde04766;color:inherit;padding:0 .15em;border-radius:3px}
table{border-collapse:collapse}
th,td{border:1px solid var(--border);padding:.35em .7em;min-width:4em;vertical-align:top}
th{background:var(--code);text-align:left}
hr{border:0;border-top:1px solid var(--border);margin:1.4em 0}
img{max-width:100%;border-radius:6px}
.callout{border:1px solid var(--border);border-left:4px solid var(--accent);background:var(--code);border-radius:6px;padding:.4em 1em;margin:.9em 0}
.callout>:first-child{margin-top:.3em}.callout>:last-child{margin-bottom:.3em}
li:has(>input[type=checkbox]){list-style:none;margin-left:-1.3em}
li>input[type=checkbox]{margin-right:.5em;accent-color:var(--accent)}
.hv-meta{color:var(--muted);font-size:.85em;margin:-.4em 0 1.2em}
`;
function scopedCss(scope){
  return CONTENT_RULES.replace(/(^|})\s*([^{}]+)\{/g,(m,p,sel)=>p+'\n'+sel.split(',').map(s=>scope+' '+s.trim()).join(',')+'{');
}
const FILE_CSS=`:root{--fg:#1f2328;--bg:#fff;--muted:#59636e;--border:#d1d9e0;--code:#f1f2f5;--accent:#7c5cff;--link:#6d4aff}
@media(prefers-color-scheme:dark){:root{--fg:#e6e6e6;--bg:#16181d;--muted:#9aa4b2;--border:#323843;--code:#20242c;--accent:#9d87ff;--link:#a99bff}}
body{margin:2.5rem auto;max-width:46rem;padding:0 1rem;font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--bg)}`+scopedCss('article');
$('style').textContent=$('style').textContent.replace('/*CONTENT_CSS_APP*/',scopedCss('#editor'));

/* ------------------------------------------------------ small helpers */
function toast(msg,ms=2200){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,ms)}
function ask(title,{value='',message='',confirm=false,ok='OK'}={}){
  return new Promise(res=>{
    const m=$('#modal'),inp=$('#mInput');
    $('#mTitle').textContent=title;$('#mMsg').textContent=message;$('#mMsg').hidden=!message;
    inp.hidden=confirm;inp.value=value;$('#mOk').textContent=ok;m.hidden=false;
    if(!confirm){inp.focus();inp.select()}else $('#mOk').focus();
    const done=v=>{m.hidden=true;cleanup();res(v)};
    const okf=()=>done(confirm?true:inp.value);
    const key=e=>{if(e.key==='Enter'){e.preventDefault();okf()}else if(e.key==='Escape')done(null)};
    const cleanup=()=>{$('#mOk').onclick=$('#mCancel').onclick=null;m.removeEventListener('keydown',key)};
    $('#mOk').onclick=okf;$('#mCancel').onclick=()=>done(null);m.addEventListener('keydown',key);
  });
}
function relPath(fromDir,toPath){
  const a=fromDir?fromDir.split('/'):[],b=toPath.split('/');let i=0;
  while(i<a.length&&i<b.length-1&&a[i]===b[i])i++;
  return [...Array(a.length-i).fill('..'),...b.slice(i)].map(encodeURIComponent).join('/');
}
const sanitizeName=n=>n.replace(/[\\:*?"<>|#^\[\]]/g,'').replace(/\s+/g,' ').trim();

/* ------------------------------------------------------ sanitising HTML
   Vault folders may hold files from anywhere, so we strip scripts and
   event handlers before anything touches the live document. */
const BAD_TAGS='script,style,meta,link,iframe,frame,object,embed,base,form,noscript,title';
function sanitizeTree(root,{keepStyle=true}={}){
  root.querySelectorAll(BAD_TAGS).forEach(e=>e.remove());
  root.querySelectorAll('*').forEach(e=>{
    for(const a of [...e.attributes]){
      const n=a.name.toLowerCase(),v=a.value.trim().toLowerCase();
      let keep=['href','src','alt','title','colspan','rowspan','type','checked','data-link','data-kind'].includes(n)||(keepStyle&&(n==='class'||n==='style'));
      if(n.startsWith('on'))keep=false;
      if((n==='href'||n==='src')&&/^(javascript|vbscript):/.test(v))keep=false;
      if(n==='src'&&/^data:(?!image\/)/.test(v))keep=false;
      if(n==='type'&&!(e.tagName==='INPUT'&&v==='checkbox'))keep=false;
      if(!keep)e.removeAttribute(a.name);
    }
    if(e.tagName==='INPUT'&&e.getAttribute('type')!=='checkbox')e.remove();
    if(e.tagName==='A'&&/^https?:/i.test(e.getAttribute('href')||'')){e.setAttribute('target','_blank');e.setAttribute('rel','noopener noreferrer')}
  });
  return root;
}

/* --------------------------------------------------- note file format */
function parseNote(path,html,mtime){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const meta=n=>doc.querySelector(`meta[name="${n}"]`)?.getAttribute('content')||'';
  const slash=path.lastIndexOf('/');
  const dir=slash<0?'':path.slice(0,slash);
  const file=path.slice(slash+1);
  const name=file.replace(/\.html?$/i,'');
  const art=doc.querySelector('article')||doc.body;
  art.querySelectorAll('.note-title,.hv-meta').forEach(e=>e.remove());
  sanitizeTree(art);
  const links=new Set();
  art.querySelectorAll('a').forEach(a=>{
    let l=a.getAttribute('data-link');
    if(!l){const h=a.getAttribute('href')||'';
      if(h&&!/^[a-z][a-z0-9+.-]*:/i.test(h)&&!h.startsWith('#')&&/\.html?(#.*)?$/i.test(h)){
        try{l=decodeURIComponent(h.split('#')[0]).split('/').pop().replace(/\.html?$/i,'')}catch{}
        if(l)a.setAttribute('data-link',l);
      }}
    if(l)links.add(l);
  });
  const text=(art.textContent||'');
  const tags=meta('hv:tags').split(',').map(s=>s.trim().replace(/^#/,'')).filter(Boolean);
  const all=new Set(tags.map(lc));
  for(const m of text.matchAll(/(?:^|\s)#([A-Za-z][\w\/-]*)/g))all.add(lc(m[1]));
  return {path,dir,name,mtime,tags,allTags:[...all],links:[...links],
    body:art.innerHTML.trim(),plain:text.replace(/\s+/g,' ').trim(),text:lc(name+' '+text),
    created:meta('hv:created')||new Date(mtime||Date.now()).toISOString(),
    updated:meta('hv:updated')||new Date(mtime||Date.now()).toISOString()};
}
function fixLinksForSave(html,dir){
  const d=document.createElement('div');d.innerHTML=html;
  d.querySelectorAll('a[data-link]').forEach(a=>{
    const t=S.byName.get(lc(a.dataset.link));
    a.classList.remove('unresolved');a.classList.add('wikilink');
    a.setAttribute('href',t?relPath(dir,t.path):encodeURIComponent(a.dataset.link)+'.html');
  });
  d.querySelectorAll('input[type=checkbox]').forEach(c=>c.checked?c.setAttribute('checked',''):c.removeAttribute('checked'));
  d.querySelectorAll('[contenteditable]').forEach(e=>e.removeAttribute('contenteditable'));
  d.querySelectorAll('[class=""]').forEach(e=>e.removeAttribute('class'));
  return d.innerHTML.replace(/<\/(p|h[1-6]|ul|ol|li|blockquote|pre|table|thead|tbody|tr|div|hr)>/g,'</$1>\n').replace(/<hr>/g,'<hr>\n').trim();
}
function serializeNote(n){
  const tagLine=n.tags.length?`<p class="hv-meta">${n.tags.map(t=>'#'+esc(t)).join(' ')}</p>\n`:'';
  return `<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${esc(n.name)}</title>
<meta name="generator" content="HTML Vault">
<meta name="hv:tags" content="${esc(n.tags.join(', '))}">

${FILE_CSS}

<article>
<h1 class="note-title">${esc(n.name)}</h1>
${tagLine}${fixLinksForSave(n.body,n.dir)}
</article>
</body>
</html>
`;
}
function wikify(html){
  return html.replace(/\[\[([^\]|<>]+?)(?:\|([^\]<>]+))?\]\]/g,(m,n,alias)=>`<a class="wikilink" data-link="${esc(n.trim())}" href="">${esc((alias||n).trim())}</a>`);
}

/* ---------------------------------------------------------- backends */
const idb={
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('htmlvault',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async get(k){try{const db=await this.open();return await new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch{return null}},
  async set(k,v){try{const db=await this.open();await new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch{}}
};
class FSBackend{
  constructor(root){this.root=root;this.kind='fs';this.name=root.name}
  async scan(){
    const out=[];
    const walk=async(dir,prefix)=>{
      for await(const [name,h] of dir.entries()){
        if(name.startsWith('.')||name==='node_modules')continue;
        if(h.kind==='directory')await walk(h,prefix+name+'/');
        else if(/\.html?$/i.test(name)){const f=await h.getFile();out.push({path:prefix+name,text:await f.text(),mtime:f.lastModified})}
      }
    };
    await walk(this.root,'');return out;
  }
  async _dir(parts,create){let d=this.root;for(const p of parts)d=await d.getDirectoryHandle(p,{create});return d}
  async write(path,text){
    const parts=path.split('/'),fn=parts.pop();
    const d=await this._dir(parts,true),fh=await d.getFileHandle(fn,{create:true});
    const w=await fh.createWritable();await w.write(text);await w.close();
    return (await fh.getFile()).lastModified;
  }
  async remove(path){const parts=path.split('/'),fn=parts.pop();const d=await this._dir(parts,false);await d.removeEntry(fn)}
  async readConfig(){try{const d=await this._dir(['.htmlvault'],false);const fh=await d.getFileHandle('graph.json');return JSON.parse(await(await fh.getFile()).text())}catch{return null}}
  async writeConfig(o){await this.write('.htmlvault/graph.json',JSON.stringify(o,null,2))}
}
/* Desktop (Electron) backend: real folder access through the preload bridge, with a file watcher. */
class NativeBackend{
  constructor(root){this.root=root;this.kind='native';this.name=root.split(/[\\/]/).filter(Boolean).pop()||root;this.fullPath=root}
  scan(){return hvNative.vault.scan(this.root)}
  write(path,text){return hvNative.vault.write(this.root,path,text)}
  remove(path){return hvNative.vault.remove(this.root,path)}
  async readConfig(){const t=await hvNative.vault.readText(this.root,'.htmlvault/graph.json');try{return t?JSON.parse(t):null}catch{return null}}
  async writeConfig(o){await this.write('.htmlvault/graph.json',JSON.stringify(o,null,2))}
}
const LS='hv:demo:';
class LocalBackend{
  constructor(){this.kind='local';this.name='Demo vault (browser storage)'}
  async scan(){const out=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(LS+'f:')){const o=JSON.parse(localStorage.getItem(k));out.push({path:k.slice(LS.length+2),text:o.text,mtime:o.mtime})}}return out}

/* ---------------------------------------------------- index + queries */
function reindex(){
  S.ver=(S.ver||0)+1;S.byName=new Map();S.backlinks=new Map();
  for(const n of S.notes.values()){const k=lc(n.name);if(!S.byName.has(k))S.byName.set(k,n)}
  for(const n of S.notes.values())for(const l of n.links){
    const t=S.byName.get(lc(l));
    if(t&&t!==n){if(!S.backlinks.has(t.path))S.backlinks.set(t.path,[]);S.backlinks.get(t.path).push(n)}
  }
}
/* Obsidian-like query: space-separated terms are AND-ed.
   tag:#x  #x  path:folder  file:name  or any word (title + content). */
function matches(note,q){
  q=q.trim();if(!q)return true;
  return q.split(/\s+/).every(tok=>{
    const t=lc(tok);let m;
    if((m=/^tag:#?(.+)$/.exec(t))||(m=/^#(.+)$/.exec(t)))return note.allTags.some(x=>x===m[1]||x.startsWith(m[1]+'/'));
    if((m=/^path:(.+)$/.exec(t)))return lc(note.path).includes(m[1]);
    if((m=/^file:(.+)$/.exec(t)))return lc(note.name).includes(m[1]);
    return note.text.includes(t);
  });
}
function groupOf(n){for(const g of S.cfg.groups)if(g.query.trim()&&matches(n,g.query))return g;return null}
function recolor(){for(const g of S.cfg.groups)g._count=0;for(const n of S.notes.values()){n._group=groupOf(n);if(n._group)n._group._count++}}
const colorOf=n=>{
  if(typeof G!=='undefined'&&G.comm){const g=G.byId&&G.byId.get(n.path);if(g&&g.comm!==undefined)return commColor(g.comm)}
  return n._group?n._group.color:null;
};

/* ---------------------------------------------------------- persistence */
const saveCfg=debounce(()=>{
  const out={settings:S.cfg.settings,groups:S.cfg.groups.map(({name,query,color,hidden})=>({name,query,color,hidden:!!hidden}))};
  S.backend?.writeConfig(out).catch(()=>{});
},400);
function autoGroups(){
  const dirs=new Map(),tags=new Map();
  for(const n of S.notes.values()){
    if(n.dir)dirs.set(n.dir.split('/')[0],(dirs.get(n.dir.split('/')[0])||0)+1);
    for(const t of n.allTags)tags.set(t,(tags.get(t)||0)+1);
  }
  let src=[...dirs].sort((a,b)=>b[1]-a[1]).slice(0,8).map(([d])=>({name:d,query:'path:'+d}));
  if(src.length<2)src=[...tags].sort((a,b)=>b[1]-a[1]).slice(0,6).map(([t])=>({name:'#'+t,query:'tag:#'+t}));
  return src.map((g,i)=>({...g,color:PALETTE[i%PALETTE.length],hidden:false}));
}

/* ====================================================== vault lifecycle */
async function useBackend(be){
  S.backend=be;S.notes.clear();
  for(const f of await be.scan()){const n=parseNote(f.path,f.text,f.mtime);if(!S.notes.has(n.path))S.notes.set(n.path,n)}
  if(!S.notes.size){
    const n=makeNoteObj('Welcome','',`<h2>Welcome</h2><p>This vault is empty. Create a note with <strong>+ New note</strong>, link notes with <code>[[double brackets]]</code>, and watch them appear in the graph.</p>`);
    await be.write(n.path,serializeNote(n));S.notes.set(n.path,parseNote(n.path,serializeNote(n),Date.now()));
  }
  reindex();
  const c=await be.readConfig();
  S.cfg=c?{settings:{...DEFAULT_SETTINGS,...c.settings},groups:(c.groups||[]).map(g=>({...g}))}:{settings:{...DEFAULT_SETTINGS},groups:autoGroups()};
  // view filters are per-session: a saved Local/filter state made the graph look empty on the next launch
  S.cfg.settings.local=false;S.cfg.settings.search='';
  $('#welcome').hidden=true;$('#vaultName').textContent=be.name;
  onVaultOpened(be);
  G.pos.clear();G.fitted=false;
  buildGraphPanel();
  const first=S.byName.get('welcome')||[...S.notes.values()].sort((a,b)=>b.mtime-a.mtime)[0];
  S.active=null;await openNote(first.path);
  refreshAll();
}
function refreshAll(){recolor();renderSidebar();renderRight();rebuildGraph();renderGroupsUI();renderLegend()}

async function reloadVault(){
  if(!S.backend)return;
  await flushSave();
  const files=await S.backend.scan();const seen=new Set();let changed=false;
  for(const f of files){
    seen.add(f.path);const old=S.notes.get(f.path);
    if(!old||old.mtime!==f.mtime){S.notes.set(f.path,parseNote(f.path,f.text,f.mtime));changed=true;
      if(old&&f.path===S.active)loadActiveIntoEditor()}
  }
  for(const p of [...S.notes.keys()])if(!seen.has(p)){S.notes.delete(p);changed=true}
  if(!S.notes.has(S.active)){S.active=null;const f=[...S.notes.values()][0];if(f)await openNote(f.path)}
  if(changed){reindex();refreshAll();toast('Vault reloaded')}
}

/* ========================================================= note CRUD */
function makeNoteObj(name,dir,body,tags=[]){
  const now=new Date().toISOString();
  return {path:(dir?dir+'/':'')+name+'.html',dir,name,tags,body,created:now,updated:now,mtime:Date.now()};
}
function splitFull(full){
  const parts=full.split('/').map(sanitizeName).filter(Boolean);
  const name=parts.pop()||'';return {dir:parts.join('/'),name};
}
function uniqueName(base){let n=base,i=1;while(S.byName.has(lc(n)))n=`${base} ${i++}`;return n}
async function createNote(full,{body='<p><br></p>',tags=[],open=true}={}){
  await flushSave();
  const {dir,name}=splitFull(full);
  if(!name)return null;
  const ex=S.byName.get(lc(name));
  if(ex){if(open)await openNote(ex.path);return ex}
  const obj=makeNoteObj(name,dir,body,tags);
  const text=serializeNote(obj);
  obj.mtime=await S.backend.write(obj.path,text);
  const note=parseNote(obj.path,text,obj.mtime);
  S.notes.set(note.path,note);reindex();refreshAll();
  if(open){await openNote(note.path);$('#title').select()}
  return note;
}
async function deleteNote(path){
  const n=S.notes.get(path);if(!n)return;
  if(!await ask('Delete note?',{message:`“${n.name}” will be removed from the vault folder.`,confirm:true,ok:'Delete'}))return;
  if(S.active===path){S.dirty=false;clearTimeout(saveTimer)}
  await S.backend.remove(path);S.notes.delete(path);reindex();
  if(S.active===path){S.active=null;const f=[...S.notes.values()][0];if(f)await openNote(f.path);else await createNote('Untitled')}
  refreshAll();toast('Deleted');
}
async function renameNote(note,newName){
  newName=sanitizeName(newName);
  if(!newName||newName===note.name)return false;
  const clash=S.byName.get(lc(newName));
  if(clash&&clash!==note){toast('A note with that name already exists');return false}
  await flushSave();
  const oldName=note.name,oldPath=note.path,newPath=(note.dir?note.dir+'/':'')+newName+'.html';
  // rewrite links in every other note that points here
  const targets=[...S.notes.values()].filter(n=>n!==note&&n.links.some(l=>lc(l)===lc(oldName)));
  const cur=S.notes.get(oldPath);
  const moved={...cur,name:newName,path:newPath,updated:new Date().toISOString()};
  S.notes.delete(oldPath);S.notes.set(newPath,moved);reindex();
  const text=serializeNote(moved);
  moved.mtime=await S.backend.write(newPath,text);
  await S.backend.remove(oldPath);
  S.notes.set(newPath,parseNote(newPath,text,moved.mtime));
  for(const t of targets){
    const d=document.createElement('div');d.innerHTML=t.body;
    d.querySelectorAll('a[data-link]').forEach(a=>{
      if(lc(a.dataset.link)===lc(oldName)){
        if(a.textContent.trim()===oldName)a.textContent=newName;
        a.dataset.link=newName;
      }
    });
    const nn={...t,body:d.innerHTML};
    S.notes.set(t.path,nn);reindex();
    const tx=serializeNote(nn);nn.mtime=await S.backend.write(t.path,tx);
    S.notes.set(t.path,parseNote(t.path,tx,nn.mtime));
  }
  reindex();S.active=newPath;G.pos.set(newPath,G.pos.get(oldPath));G.pos.delete(oldPath);
  refreshAll();toast(targets.length?`Renamed, updated ${targets.length} linking note${targets.length>1?'s':''}`:'Renamed');
  return true;
}

/* ====================================================== editor + saving */
const editor=$('#editor'),titleEl=$('#title');
let saveTimer=null;
function setStatus(t){$('#status').textContent=t}
function scheduleSave(){S.dirty=true;setStatus('Editing…');clearTimeout(saveTimer);saveTimer=setTimeout(()=>flushSave(),800)}
async function flushSave(){
  clearTimeout(saveTimer);
  if(!S.dirty||!S.active)return;
  const cur=S.notes.get(S.active);if(!cur)return;
  S.dirty=false;
  const body=fixLinksForSave(editor.innerHTML,cur.dir);
  const obj={...cur,body,updated:new Date().toISOString()};
  try{
    const text=serializeNote(obj);
    obj.mtime=await S.backend.write(cur.path,text);
    const fresh=parseNote(cur.path,text,obj.mtime);
    S.notes.set(cur.path,fresh);reindex();
    recolor();renderSidebar();renderRight();rebuildGraphSoft();renderGroupsUI();renderLegend();
    setStatus('Saved ✓');
  }catch(e){console.error(e);setStatus('Save failed!');toast('Could not save: '+e.message,4000);S.dirty=true}
}
function decorateLinks(){
  editor.querySelectorAll('a[data-link]').forEach(a=>{

function loadActiveIntoEditor(){

async function openNote(path){

/* ---- [[wikilink]] typing + autocomplete ---- */
const LP={open:false,items:[],idx:0,node:null,start:0,end:0};
function insertWikilink(node,start,end,name,alias){
  const r=document.createRange();r.setStart(node,start);r.setEnd(node,end);r.deleteContents();
  const a=document.createElement('a');
  a.className='wikilink'+(S.byName.has(lc(name))?'':' unresolved');
  a.dataset.link=name;a.setAttribute('href','');a.textContent=alias||name;
  r.insertNode(a);
  const sp=document.createTextNode(' ');a.after(sp);
  const sel=getSelection(),nr=document.createRange();nr.setStart(sp,1);nr.collapse(true);sel.removeAllRanges();sel.addRange(nr);
  scheduleSave();
}
function closeLP(){LP.open=false;$('#lpop').hidden=true}
function checkLinkTrigger(){
  const sel=getSelection();
  if(!sel.rangeCount||!sel.isCollapsed)return closeLP();
  const n=sel.anchorNode;
  if(!n||n.nodeType!==3||!editor.contains(n)||n.parentElement.closest('a'))return closeLP();
  const before=n.data.slice(0,sel.anchorOffset);
  const done=/\[\[([^\[\]\n]+)\]\]$/.exec(before);
  if(done){
    const [nm,alias]=done[1].split('|');
    insertWikilink(n,sel.anchorOffset-done[0].length,sel.anchorOffset,nm.trim(),alias?.trim());
    return closeLP();
  }
  const m=/\[\[([^\[\]\n|]*)$/.exec(before);
  if(!m)return closeLP();
  const q=lc(m[1].trim());
  const names=[...S.notes.values()].map(x=>x.name).filter(x=>!q||lc(x).includes(q))
    .sort((a,b)=>(lc(a).startsWith(q)?0:1)-(lc(b).startsWith(q)?0:1)||a.localeCompare(b)).slice(0,8);
  const items=names.map(x=>({name:x,create:false}));
  if(q&&!S.byName.has(q))items.push({name:m[1].trim(),create:true});
  if(!items.length)return closeLP();
  Object.assign(LP,{open:true,items,idx:0,node:n,start:m.index,end:sel.anchorOffset});
  renderLP();
}
function renderLP(){
  const p=$('#lpop');p.hidden=false;
  p.innerHTML=LP.items.map((it,i)=>`<div class="${i===LP.idx?'sel':''}${it.create?' new':''}" data-i="${i}">${it.create?'＋ Create “'+esc(it.name)+'”':esc(it.name)}</div>`).join('');
  const sel=getSelection();let r=null;
  if(sel.rangeCount){const rc=sel.getRangeAt(0).getClientRects();r=rc[0]||sel.getRangeAt(0).startContainer.parentElement?.getBoundingClientRect()}
  if(r){p.style.left=Math.min(r.left,innerWidth-350)+'px';p.style.top=(r.bottom+4)+'px'}
}
function pickLP(i){
  const it=LP.items[i];if(!it)return;
  insertWikilink(LP.node,LP.start,LP.end,it.name);closeLP();
}
$('#lpop').addEventListener('mousedown',e=>{e.preventDefault();const d=e.target.closest('[data-i]');if(d)pickLP(+d.dataset.i)});
editor.addEventListener('keydown',e=>{
  if(!LP.open)return;
  if(e.key==='ArrowDown'){e.preventDefault();LP.idx=(LP.idx+1)%LP.items.length;renderLP()}
  else if(e.key==='ArrowUp'){e.preventDefault();LP.idx=(LP.idx-1+LP.items.length)%LP.items.length;renderLP()}
  else if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();pickLP(LP.idx)}
  else if(e.key==='Escape'){e.preventDefault();closeLP()}
});

(function buildToolbar(){

  const walk=(node,depth,prefix)=>{

  const edges=[],seen=new Set();
  const add=(a,b)=>{const k=a+'\n'+b;if(seen.has(k))return;seen.add(k);edges.push({a,b})};
  for(const n of S.notes.values()){

    for(const l of n.links){
      const t=S.byName.get(lc(l));
      if(t){if(t!==n&&vis.has(t.path))add(n.path,t.path)}

      const a=Math.random()*6.283,r=base?20+Math.random()*30:Math.sqrt(Math.random())*R;
      p={x:(base?base.x:0)+Math.cos(a)*r,y:(base?base.y:0)+Math.sin(a)*r,vx:0,vy:0};G.pos.set(id,p);

function resetGraphView(){

/* cheap path used after an autosave: refresh data, only reheat on structural change */
const rebuildGraphSoft=()=>rebuildGraph();

function tick(prewarm=false){

    const p=n[i];

      const q=n[j];let dx=q.x-p.x,dy=q.y-p.y,d2=dx*dx+dy*dy;
      if(d2>cutoff)continue;
      if(d2<1){dx=Math.random()-.5;dy=Math.random()-.5;d2=dx*dx+dy*dy+.01}
      const f=rep*a/Math.max(d2,30);
      p.vx-=dx*f;p.vy-=dy*f;q.vx+=dx*f;q.vy+=dy*f;
    }

    const {s:p,t:q}=e;let dx=q.x-p.x,dy=q.y-p.y;const d=Math.sqrt(dx*dx+dy*dy)||1;

const nodeR=n=>Math.max(2.5,gs().nodeSize*(0.7+Math.sqrt(n.deg||0)*0.55));
const COMM_COLORS=['#60a5fa','#f59e0b','#34d399','#f472b6','#a78bfa','#f87171','#2dd4bf','#facc15','#fb923c','#84cc16','#38bdf8','#e879f9'];

  G.pan=null;
});
cv.addEventListener('pointerleave',()=>{if(!G.drag&&G.hover){G.hover=null;G.dirty=true}});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=cv.getBoundingClientRect(),sx=e.clientX-r.left,sy=e.clientY-r.top;
  const w=toWorld(sx,sy),k=clamp(G.v.k*Math.exp(-e.deltaY*0.0015),0.05,6);
  G.v.k=k;G.v.x=sx-w.x*k;G.v.y=sy-w.y*k;G.fitted=true;G.dirty=true;
},{passive:false});
function graphClick(n){
  if(n.kind==='note')openNote(n.id);
  else if(n.kind==='ghost')ask('Create this note?',{message:`“${n.label}” is linked from other notes but doesn't exist yet. Create an empty note with this name?`,confirm:true,ok:'Create'}).then(ok=>{if(ok)createNote(n.label)});
  else if(n.kind==='tag'){fsearch.value='tag:'+n.label;renderSidebar();setView(S.view==='graph'?'split':S.view)}
}
$('#gFit').onclick=fitGraph;
$('#gAnim').onclick=()=>{G.alpha=1;G.dirty=true};
$('#gLocal').onclick=()=>{gs().local=!gs().local;saveCfg();syncGraphControls();rebuildGraph()};
$('#gGear').onclick=()=>{S.gearOpen=!S.gearOpen;$('#gpanel').hidden=!S.gearOpen;$('#gGear').classList.toggle('on',S.gearOpen)};

/* ---- graph settings panel ---- */
function ctlToggle(parent,label,key,{rebuild=false,reheat=false}={}){
  const d=document.createElement('div');d.className='ctl';
  d.innerHTML=`<label>${label}</label><input type="checkbox">`;
  const i=$('input',d);i.checked=!!gs()[key];i.dataset.key=key;
  i.onchange=()=>{gs()[key]=i.checked;saveCfg();if(rebuild)rebuildGraph();if(reheat){G.alpha=Math.max(G.alpha,.6);G.sig=''}G.dirty=true;if(key==='separate')rebuildGraph();syncGraphControls()};
  parent.appendChild(d);
}
function ctlRange(parent,label,key,min,max,step,{rebuild=false,reheat=false}={}){
  const d=document.createElement('div');d.className='ctl';
  d.innerHTML=`<label>${label}</label><input type="range" min="${min}" max="${max}" step="${step}">`;
  const i=$('input',d);i.value=gs()[key];i.dataset.key=key;
  i.oninput=()=>{gs()[key]=+i.value;saveCfg();if(rebuild)rebuildGraph();if(reheat)G.alpha=Math.max(G.alpha,.5);G.dirty=true};
  parent.appendChild(d);
}
function buildGraphPanel(){
  const p=$('#gpanel');p.innerHTML='';
  const sec=(title,open)=>{const d=document.createElement('details');d.open=open;d.innerHTML=`<summary>${title}</summary>`;p.appendChild(d);return d};
  const f=sec('Filters',true);
  const sd=document.createElement('div');sd.className='ctl';sd.innerHTML='<input type="text" placeholder="Filter nodes…  tag:#x  path:folder">';
  const si=$('input',sd);si.value=gs().search;si.oninput=debounce(()=>{gs().search=si.value;saveCfg();rebuildGraph()},150);f.appendChild(sd);
  ctlToggle(f,'Tags (as nodes)','showTags',{rebuild:true});
  ctlToggle(f,'Unresolved links','showUnresolved',{rebuild:true});
  ctlToggle(f,'Orphans','showOrphans',{rebuild:true});
  ctlToggle(f,'Local graph (open note)','local',{rebuild:true});
  ctlRange(f,'Local depth','depth',1,4,1,{rebuild:true});
  const g=sec('Color groups',true);g.id='groupsSec';
  const cm=document.createElement('div');cm.className='ctl';
  cm.innerHTML='<label>Color by</label><select><option value="group">My color groups</option><option value="community">Auto communities</option></select>';
  const cms=$('select',cm);cms.value=gs().colorMode;
  cms.onchange=()=>{gs().colorMode=cms.value;setHighlight(null);saveCfg();rebuildGraph();renderLegend();renderSidebar()};
  g.appendChild(cm);
  const hint=document.createElement('div');hint.className='gname';hint.textContent='First matching group wins. Queries: tag:#idea  path:Projects  file:budget  or any word.';g.appendChild(hint);
  const gl=document.createElement('div');gl.id='grpList';g.appendChild(gl);
  const add=document.createElement('button');add.textContent='＋ New group';add.style.marginTop='6px';
  add.onclick=()=>{S.cfg.groups.push({name:'',query:'',color:PALETTE[S.cfg.groups.length%PALETTE.length],hidden:false});saveCfg();renderGroupsUI();$$('#grpList .grp:last-child input[data-q]')[0]?.focus()};
  g.appendChild(add);
  ctlToggle(g,'Separate groups into clusters','separate',{});
  ctlRange(g,'Separation strength','separation',0.02,0.6,0.01,{reheat:true});
  const d=sec('Display',false);
  ctlToggle(d,'Arrows','arrows');
  ctlRange(d,'Node size','nodeSize',2,12,0.5);
  ctlRange(d,'Link thickness','linkWidth',0.3,4,0.1);
  ctlRange(d,'Text fade threshold','labelThreshold',0,2.5,0.05);
  const fo=sec('Forces',false);
  ctlRange(fo,'Center force','center',0,0.3,0.005,{reheat:true});
  ctlRange(fo,'Repel force','repel',50,3000,10,{reheat:true});
  ctlRange(fo,'Link force','linkForce',0.02,1,0.01,{reheat:true});
  ctlRange(fo,'Link distance','linkDistance',20,300,5,{reheat:true});
  p.appendChild(buildInsightsSection());
  syncGraphControls();
}
function setHighlight(ids,key){G.hl=ids&&ids.length?new Set(ids):null;G.hlKey=G.hl?key:null;G.dirty=true}
function syncGraphControls(){$('#gLocal').classList.toggle('on',!!gs().local);$$('#gpanel input[type=checkbox]').forEach(i=>i.checked=!!gs()[i.dataset.key])}
const regroup=debounce(()=>{recolor();renderSidebar();renderRight();rebuildGraph();renderLegend();saveCfg()},200);
function renderGroupsUI(){
  const box=$('#grpList');if(!box)return;
  if(box.contains(document.activeElement)&&document.activeElement.tagName==='INPUT'&&document.activeElement.type==='text'){
    S.cfg.groups.forEach((g,i)=>{const c=$(`[data-gc="${i}"]`,box);if(c)c.textContent=`${g._count||0} notes`});return;
  }
  box.innerHTML='';
  S.cfg.groups.forEach((g,i)=>{
    const row=document.createElement('div');row.className='grp'+(g.hidden?' hid':'');
    row.innerHTML=`<input type="color" value="${g.color}" title="Group color"><div style="flex:1;min-width:0"><input type="text" data-n placeholder="Group name" value="${esc(g.name||'')}" style="width:100%;margin-bottom:3px"><input type="text" data-q placeholder="query, e.g. tag:#idea" value="${esc(g.query)}" style="width:100%"><div class="gname" data-gc="${i}">${g._count||0} notes</div></div><div style="display:flex;flex-direction:column;gap:3px"><button data-eye title="Show / hide this group in the graph">${g.hidden?'🙈':'👁'}</button><button data-up title="Higher priority">↑</button><button data-del title="Delete group">✕</button></div>`;
    $('input[type=color]',row).oninput=e=>{g.color=e.target.value;recolor();renderSidebar();renderLegend();G.dirty=true;saveCfg()};
    $('[data-n]',row).oninput=e=>{g.name=e.target.value;regroup()};
    $('[data-q]',row).oninput=e=>{g.query=e.target.value;regroup()};
    $('[data-eye]',row).onclick=()=>{g.hidden=!g.hidden;regroup();renderGroupsUI()};
    $('[data-up]',row).onclick=()=>{if(i>0){[S.cfg.groups[i-1],S.cfg.groups[i]]=[S.cfg.groups[i],S.cfg.groups[i-1]];regroup();renderGroupsUI()}};
    $('[data-del]',row).onclick=()=>{S.cfg.groups.splice(i,1);regroup();renderGroupsUI()};
    box.appendChild(row);
  });
}
function renderLegend(){
  const el=$('#glegend');
  if(G.comm){
    el.hidden=false;
    el.innerHTML=G.commInfo.map(c=>`<div class="lg" data-comm="${c.id}" title="Click to highlight this cluster. Cohesion ${(c.cohesion*100).toFixed(0)}%${c.cohesion<0.15&&c.size>=3?' (loose)':''}"><span class="dot" style="background:${commColor(c.id)}"></span>${esc(c.top)}${c.cohesion<0.15&&c.size>=3?' ⚠':''}<span class="cnt">${c.size}</span></div>`).join('');
    return;
  }
  if(!S.cfg.groups.length){el.hidden=true;return}
  el.hidden=false;
  el.innerHTML=S.cfg.groups.map((g,i)=>`<div class="lg${g.hidden?' hid':''}" data-i="${i}" title="Click to show / hide"><span class="dot" style="background:${g.color}"></span>${esc(g.name||g.query||'(empty)')}<span class="cnt">${g._count||0}</span></div>`).join('');
}
$('#glegend').addEventListener('click',e=>{
  const d=e.target.closest('.lg');if(!d)return;
  if(d.dataset.comm!==undefined){
    const id=+d.dataset.comm;
    const same=G.hl&&G.hlKey==='c'+id;
    setHighlight(same?null:G.nodes.filter(n=>n.comm===id).map(n=>n.id),'c'+id);return;
  }
  const g=S.cfg.groups[+d.dataset.i];g.hidden=!g.hidden;regroup();renderGroupsUI();
});

/* ============================================================ chrome === */
function setView(v){
  S.view=v;document.body.dataset.view=v;
  $$('#viewSeg button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  requestAnimationFrame(()=>{G.w=0;resizeGraph();if(!G.fitted)fitGraph();G.dirty=true});
  try{localStorage.setItem('hv:view',v)}catch{}
}
$('#viewSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setView(b.dataset.view)});
function setTheme(t){
  document.documentElement.dataset.theme=t;try{localStorage.setItem('hv:theme',t)}catch{}
  readTheme();
}
$('#btnTheme').onclick=()=>setTheme(document.documentElement.dataset.theme==='light'?'dark':'light');
$('#btnVault').onclick=async()=>{await flushSave();showWelcome()};

/* ============================================================ welcome === */
const NATIVE=typeof hvNative!=='undefined';
async function showWelcome(){
  $('#welcome').hidden=false;
  const hasFS=NATIVE||'showDirectoryPicker' in window;
  $('#wOpen').disabled=!hasFS;
  $('#wNote').textContent=hasFS?'':'Folder access needs the desktop app or Chrome / Edge. You can still try the demo vault.';
  const last=NATIVE?(await hvNative.settings.get()).lastVault:await idb.get('lastVault');
  $('#wReopen').hidden=!last;
  if(last)$('#wReopenName').textContent=NATIVE?last:last.name;
}
async function openNativeVault(root){
  await useBackend(new NativeBackend(root));
}
async function openFolder(handle){
  const be=new FSBackend(handle);
  await idb.set('lastVault',handle);
  await useBackend(be);
}
$('#wOpen').onclick=async()=>{
  try{
    if(NATIVE){const p=await hvNative.vault.pick();if(p)await openNativeVault(p);return}
    const h=await showDirectoryPicker({mode:'readwrite'});await openFolder(h)
  }catch(e){if(e.name!=='AbortError'){console.error(e);toast('Could not open folder: '+e.message,4000)}}
};
$('#wReopen').onclick=async()=>{
  try{
    if(NATIVE){await openNativeVault((await hvNative.settings.get()).lastVault);return}
    const h=await idb.get('lastVault');
    if(await h.requestPermission({mode:'readwrite'})!=='granted'){toast('Permission was not granted');return}
    await openFolder(h);
  }catch(e){console.error(e);toast('Could not reopen: '+e.message,4000)}
};
$('#wDemo').onclick=async()=>{
  const be=new LocalBackend();
  if(!(await be.scan()).length)await seedDemo(be);
  await useBackend(be);
};

    ['Welcome','',['welcome'],`<p>Welcome to <strong>HTML Vault</strong>, a graph notebook where every note is a real <mark>HTML file</mark>.</p>

/* ================================================================ boot === */
(function boot(){
  let t='dark';try{t=localStorage.getItem('hv:theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}catch{}
  setTheme(t);
  try{const v=localStorage.getItem('hv:view');if(v)setView(v)}catch{}
  editor.addEventListener('click',e=>{if(e.target.matches('input[type=checkbox]'))setTimeout(scheduleSave)});
  requestAnimationFrame(loop);
  initFeatures();
  showWelcome().then(async()=>{
    // desktop app: go straight back into the last vault
    if(NATIVE){const last=(await hvNative.settings.get()).lastVault;if(last&&await hvNative.vault.exists(last))openNativeVault(last).catch(e=>{console.error(e);toast('Could not reopen last vault')})}
  });
  window.addEventListener('beforeunload',e=>{if(S.dirty){flushSave();e.preventDefault();e.returnValue=''}});
  window.__hv={S,G}; // handy for debugging in devtools
})();
</script>
